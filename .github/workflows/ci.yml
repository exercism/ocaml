name: ocaml / main

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@44184b0d1ab751e3d1726b13e0afef61d6980755
        with:
          ocaml-compiler: 5.4

      - name: Install dependencies
        run: opam install ocamlformat.0.28.1 dune

      - name: Check formatting
        run: opam exec -- dune build @fmt --root test-generator

  ci:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: true

      - name: Build ocaml-ci docker image
        run: docker build -t ocaml-ci -f .github/Dockerfile .

      - name: Run exercism/ocaml ci (runs tests) for all exercises
        run: docker run -w /repo -v $(pwd):/repo ocaml-ci .github/.gha-ci.sh
